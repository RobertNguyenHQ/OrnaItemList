[project]
name = "ornacodexcrawler"
version = "3.0.0"
description = "OrnaCodex Crawler"
readme = "README.md"
authors = [
    { name = "67au", email = "oyy6745@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "scrapy>=2.19.0",
]

[project.scripts]
ornacodexcrawler = "ornacodexcrawler:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
