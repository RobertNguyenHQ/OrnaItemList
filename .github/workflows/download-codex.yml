name: Download Orna Codex

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated languages (e.g. en,de,fr,zh-hans)"
        default: "en"
      force:
        description: "Ignore ETag and re-download everything"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC

permissions:
  contents: write

concurrency:
  group: codex-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install "httpx>=0.28.1"

      - name: Download codex
        env:
          PYTHONPATH: src
          CODEX_LANGS: ${{ inputs.languages || 'en' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: python scripts/download_codex.py

      - name: Upload as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orna-codex
          path: data/
          if-no-files-found: warn

      - name: Commit data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update codex data $(date -u +%F)"
            git push
          fi
